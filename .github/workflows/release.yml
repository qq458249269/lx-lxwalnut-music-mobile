name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'publish/version.json'

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      package_version: ${{ steps.resolve.outputs.next_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_prerelease: ${{ steps.resolve.outputs.release_prerelease }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Cache Metro transform cache
        uses: actions/cache@v5
        with:
          path: .metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json', 'metro.config.js', 'babel.config.js') }}
          restore-keys: |
            metro-${{ runner.os }}-

      # 先算本次发布版本（四段 YY.MM.DD[.N]，同日递增末位），再注入 package.json（version+versionCode）。
      # 与本地 npm run publish 共用 bump-version 模块，单一来源。
      - name: Compute & inject version
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BASE_VERSION=$(node -p -e 'require("./package.json").version')
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,isDraft,isPrerelease > /tmp/tags.json || echo '[]' > /tmp/tags.json
          NEXT_VERSION=$(BASE_VERSION="${BASE_VERSION}" TAGS_JSON="/tmp/tags.json" node -p -e 'const {computeNextVersion,todayVersion}=require("./publish/utils/bump-version.cjs");let tags=[];try{tags=JSON.parse(require("fs").readFileSync(process.env.TAGS_JSON,"utf8"))}catch(e){};computeNextVersion(process.env.BASE_VERSION,tags,todayVersion())')
          RELEASE_TAG="v${NEXT_VERSION}"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # tag 已存在（如并发重跑）：后缀区分，避免同名 tag 冲突
            RELEASE_TAG="${RELEASE_TAG}-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            RELEASE_NAME="${NEXT_VERSION} test ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            RELEASE_NAME="${RELEASE_TAG}"
          fi
          # 统一发 Pre-release
          RELEASE_PRERELEASE="true"

          node -e "const fs=require('fs');const f='./package.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));const {versionCodeOf}=require('./publish/utils/bump-version.cjs');j.version='${NEXT_VERSION}';j.versionCode=versionCodeOf('${NEXT_VERSION}');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_ENV"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_prerelease=${RELEASE_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          PACKAGE_VERSION: ${{ steps.resolve.outputs.next_version }}
        shell: bash
        run: |
          cd android
          echo ${{ secrets.MYAPP_KEYSTORE_BASE64 }} | base64 --decode > app/${{ secrets.MYAPP_UPLOAD_STORE_FILE }}
          chmod +x ./gradlew
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.MYAPP_UPLOAD_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}'
          rm -f app/${{ secrets.MYAPP_UPLOAD_STORE_FILE }}

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ steps.resolve.outputs.next_version }}

  Sync:
    name: Sync
    runs-on: ubuntu-latest
    needs:
      - Android
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Sync version.json to release tag
        env:
          NEW_VERSION: ${{ needs.Android.outputs.next_version }}
        shell: bash
        run: |
          node -e "const {compareVer}=require('./publish/utils/bump-version.cjs');const fs=require('fs');const f='./publish/version.json';const v=JSON.parse(fs.readFileSync(f,'utf8'));if(compareVer('${NEW_VERSION}',v.version||'')>0){v.version='${NEW_VERSION}';fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n')}else{console.log('version.json already >= ${NEW_VERSION}, skip')}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/version.json
          if git diff --cached --quiet; then
            echo "No version change, skip commit."
          else
            git commit -m "chore: bump version.json to ${NEW_VERSION}"
            git push origin HEAD:main
            echo "version.json updated to ${NEW_VERSION}"
          fi

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - Android
      - Sync
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate release body
        run: |
          awk 'BEGIN{RS="---"}{if(NR==1)print $0}' ./publish/changeLog.md > RELEASE_NOTES.md
          echo -e '\n### File MD5\n```' >> RELEASE_NOTES.md
          cd artifacts
          md5sum *.apk >> ../RELEASE_NOTES.md
          cd ..
          echo -e '```\n' >> RELEASE_NOTES.md
          echo -e '\n[软件安装包说明](https://lyswhut.github.io/lx-music-doc/download#%E8%BD%AF%E4%BB%B6%E5%AE%89%E8%A3%85%E5%8C%85%E8%AF%B4%E6%98%8E)\n' >> RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.Android.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.Android.outputs.release_prerelease }}
          draft: false
          tag_name: ${{ needs.Android.outputs.release_tag }}
          files: |
            artifacts/lx-lxwalnut-music-mobile-v${{ needs.Android.outputs.package_version }}-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}